# The repo's one enforcement point (GH #87 §2). Every check lives in `make ci`; this file is
# only the environment it needs, so CI can't drift from a local run.
#
# macos-latest: B2 ships on macOS only, and the Xcode CLT there supply the WebView and `make`.
#
# Model-free: no `b2 init`, tests run under `B2_EMBEDDER=fake`. Real-model evals stay out of CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels the branch's in-flight run. `main` has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: make ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: the no-arg form installs exactly what rust-toolchain.toml pins.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Dependencies build at opt-level 3 (Cargo.toml), so a cold build is slow.
      - uses: Swatinem/rust-cache@v2

      # Pinned, not lts/*, so a new LTS can't change the runner under us.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` so lockfile drift is an error, not a silent rewrite.
      - name: Install frontend dependencies
        run: npm --prefix ui ci

      # The gate: the same command as a local run.
      - run: make ci

      # Nothing above may edit a tracked file: catches lockfile drift and any write to
      # fixtures/golden-vault/ (no unbidden writes, GH #170).
      - name: Assert the gate left the working tree clean
        run: |
          if ! git diff --exit-code; then
            echo "::error::A gate stage modified a tracked file — see the diff above."
            exit 1
          fi
