# The repo's one enforcement point (GH #87 §2). Everything it *checks* lives in `just ci`, not
# here — this file is only the environment that recipe needs. That split is deliberate: a check
# re-specified in YAML is a check that can drift from the one you run locally, and until this
# workflow existed CLAUDE.md's "what CI runs" was aspirational. Now `just ci` is literally it.
#
# Runner: macos-latest. B2 is developed and shipped on macOS only — Metal is macOS-only, and the
# Xcode Command Line Tools that `b2-desktop`'s WebView links against are preinstalled there, so
# the whole workspace (including the Tauri host) builds with no platform setup step at all. A
# Linux runner would need the webkit2gtk/libsoup apt block and would red-build on portability
# breaks nobody ships against.
#
# Model-free by construction, so no `b2 init` step and no model download: `b2-core` never links
# candle, and `b2-cli`'s tests spawn the binary under `B2_EMBEDDER=fake` (crates/b2-cli/tests/cli.rs).
# The real-model work — `just eval` and friends — is non-deterministic and stays out of CI on
# purpose (CLAUDE.md, "Keep `cargo test` fast, deterministic, and model-free").

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the in-flight run for that branch obsolete; cancel it rather
# than pay for both. `main` gets its own group so a merge is never cancelled by a PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: just ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml is already the single source of the pin
      # (1.96 + rustfmt + clippy), and the no-arg form installs exactly what it names — so CI
      # can't silently run a different toolchain than a local `cargo` invocation resolves.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Caches ~/.cargo and target/. Load-bearing here: the workspace builds every dependency
      # at opt-level 3 (see Cargo.toml's profile block), and candle dominates a cold build.
      - uses: Swatinem/rust-cache@v2

      # Pinned rather than lts/* so a new LTS can't change the runner under us; 24 is what the
      # repo is developed against. The floor is vite 6's engines field — Node 18, 20, or 22+.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` — not `npm install` — because CI is where lockfile drift should be an error
      # rather than a silent rewrite. `just ci`'s own `ui-install` prerequisite is a no-op after
      # this, and the tree-clean assertion below catches it if it turns out not to be.
      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - uses: extractions/setup-just@v4

      # The gate. Same command, same stages, same order as a local run.
      - run: just ci

      # Nothing above is allowed to edit a tracked file. This catches two real invariants at
      # once: `ui-install` rewriting package-lock.json (drift between package.json and the
      # committed lockfile), and the engine suite mutating fixtures/golden-vault/ — the tests
      # copy it into a tempdir first precisely so ingest's `b2id` stamping can't touch the repo
      # copy (CLAUDE.md, "Conventions"), and that has been a convention with nothing behind it.
      - name: Assert the gate left the working tree clean
        run: |
          if ! git diff --exit-code; then
            echo "::error::A gate stage modified a tracked file — see the diff above."
            exit 1
          fi
