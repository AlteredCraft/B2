[package]
name = "b2-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "B2's chat provider — a hand-rolled sync OpenAI-compatible SSE client behind the b2-core LlmProvider seam"

# The wire half of the second AI seam (GH #151 §"How B2 talks to it", cut as GH #154).
# The whole dependency list is the decision: `ureq` (already in the tree via b2-embed's
# hf-hub) is a BLOCKING client, so the crate is sync end-to-end and **no tokio enters the
# workspace** — cancellation is returning early from a read loop, not a runtime.

[dependencies]
b2-core = { path = "../b2-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Flow milestones + the wire's own anomalies (a keep-alive-only stream, a frame we
# ignored), on the `b2::llm` target. Emitting costs nothing until an adapter subscribes.
tracing = "0.1.41"
# Default features carry rustls + webpki-roots: a **cloud** endpoint is HTTPS, and the
# Local/Cloud split is a URL change, so TLS is not optional here.
ureq = "2.12.1"

[dev-dependencies]
# The out-of-CI groundedness eval (`examples/groundedness.rs`) scores a real model over
# the eval corpus, which means a real *embedder* too — retrieval is what it grounds on.
# Dev-only, so the shipped crate stays candle-free.
b2-embed = { path = "../b2-embed" }
tempfile = "3.27.0"
