[package]
name = "b2-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "B2's chat provider — a hand-rolled sync OpenAI-compatible SSE client behind the b2-core LlmProvider seam"

# The wire half of the chat seam (GH #151, GH #154). `ureq` is a blocking client, so the
# crate is sync end-to-end: cancellation is an early return from a read loop. No tokio in
# the tree (GH #174); `make no-tokio` is the guard.

[dependencies]
b2-core = { path = "../b2-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Flow milestones and wire anomalies, on the `b2::llm` target.
tracing = "0.1.41"
# Default features carry rustls: a cloud endpoint is HTTPS.
ureq = "2.12.1"

[dev-dependencies]
# The groundedness eval (`examples/groundedness.rs`) needs a real embedder for retrieval.
# Dev-only, so the shipped crate stays candle-free.
b2-embed = { path = "../b2-embed" }
tempfile = "3.27.0"
