[package]
name = "b2-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "B2 CLI — the first dumb adapter over the b2-core typed API (headless-first)"

[[bin]]
name = "b2"
path = "src/main.rs"

[dependencies]
b2-core = { path = "../b2-core" }
b2-embed = { path = "../b2-embed" }
b2-llm = { path = "../b2-llm" }
clap = { version = "4.6.1", features = ["derive", "env"] }
# `print_json`'s bound, and the derive for the `ask --json` stream's `AskEvent`.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Ctrl-C as a cooperative cancel (GH #16).
ctrlc = "3.4"
# `reindex --cancel` sends the same SIGINT to the lock's pid (GH #55). A safe `kill(2)`
# wrapper, already in the tree via ctrlc. Unix-only, as is B2.
nix = { version = "0.31", default-features = false, features = ["signal"] }
# The opt-in JSON Lines log sink (B2_LOG/B2_DEBUG).
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# Metal GPU embedding (GH #40, macOS-only); the default build is CPU.
[features]
metal = ["b2-embed/metal"]

[dev-dependencies]
tempfile = "3.27.0"
