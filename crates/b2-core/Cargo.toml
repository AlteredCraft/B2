[package]
name = "b2-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"  # libsqlite3-sys 0.38 build.rs uses the cfg_select! macro (stable since 1.95)
description = "B2 index engine — the SQLite-backed disposable projection of (Markdown ∪ log)"

[dependencies]
blake3 = "1.8.5"
# "trace": per-statement timing for the `b2::sqlite` events (db.rs).
rusqlite = { version = "0.40.1", features = ["bundled", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
# Facade only; adapters install the subscriber.
tracing = "0.1.41"
yaml-rust2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"
rusqlite = "0.40.1"
tempfile = "3.27.0"
# For tests/logging.rs.
tracing-subscriber = { version = "0.3.20", features = ["json"] }
