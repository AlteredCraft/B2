[package]
name = "b2-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "B2 desktop app — the Tauri host, a dumb adapter over the b2-core Vault façade (the GUI sibling of b2-cli)"

# Depends on b2-core; the core never learns about Tauri or the UI
# (crates/b2-desktop/CLAUDE.md), so `cargo test -p b2-core` never compiles webview deps.

[[bin]]
name = "b2-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
b2-core = { path = "../b2-core" }
b2-embed = { path = "../b2-embed" }
# The chat provider and Ollama onboarding (GH #155), injected like b2-embed. Sync, no runtime.
b2-llm = { path = "../b2-llm" }
tauri = { version = "2", features = [] }
# Folder picker for the vault switcher, called host-side only; the webview gets no dialog
# permission (capabilities/default.json).
tauri-plugin-dialog = "2"
# "Open in system default" for resources and web links: an OS handoff, since a link
# followed in the webview would replace the app. Called host-side after validating the
# path or URL; the webview gets no opener permission.
tauri-plugin-opener = "2"
# Plain-text clipboard read for ⌘⇧V (ui/src/paste.ts). Host-side because WebKit runs no
# paste for a raw ⌘⇧V and gates `navigator.clipboard` behind a native prompt. The webview
# gets no clipboard permission.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
# `import_file`: a dropped file reaches the webview as bytes, not a path, and crosses the
# JSON IPC as base64. Already in the tree via tauri.
base64 = "0.22"
# Platform data dir for the "last opened vault" state file; same `data_dir()/b2/` as
# b2-embed's model cache.
dirs = "6"
# Filesystem watch for auto-reload on external edits (#14): coalesced into one debounced
# `vault-changed` event. The webview gets no filesystem permission.
notify = "8"
# Opt-in JSONL log sink, the CLI's twin (src/logging.rs). `tracing-appender` gives the
# non-blocking writer a long-lived, multi-threaded host needs.
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde_json = "1.0.150"

# The macOS Keychain, for the cloud API key (GH #176, src/keychain.rs). A library, not
# `/usr/bin/security`, whose `-w <key>` would put the token in argv and `ps`. Elsewhere
# `keychain.rs` compiles a stub that remembers nothing.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# Metal GPU embedder (GH #40, macOS-only); `make app` selects it on Apple Silicon.
[features]
metal = ["b2-embed/metal"]

[dev-dependencies]
tempfile = "3.27.0"
# Tests the `CmdError` serialization the way Tauri does.
serde_json = "1.0.150"
