[package]
name = "b2-embed"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "B2's real local embedder — candle-backed inference behind the b2-core Embedder seam"

# Heavy ML deps live only here, never in b2-core, so the core suite stays model-free
# (CLAUDE.md).

[dependencies]
b2-core = { path = "../b2-core" }
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
# Download seam for `b2 init`. No default features (GH #174): the `tokio` default pulls the
# whole async HTTP stack for an API B2 never calls (we use `hf_hub::api::sync`). This also
# drops `native-tls`, so TLS is ureq's rustls + webpki-roots rather than the OS trust store:
# a corporate MITM CA in the system store is not trusted. `ureq/native-certs` is the escape
# hatch.
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
tokenizers = "0.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8"
dirs = "6.0"
thiserror = "2.0.18"

# On macOS, link Accelerate for candle's CPU matmuls; without it bge-base inference is
# ~10-100× slower. Other targets are unaffected.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["accelerate"] }
candle-nn = { version = "0.9", features = ["accelerate"] }
candle-transformers = { version = "0.9", features = ["accelerate"] }

# Run the forward pass on the Metal GPU (GH #40), additive over `accelerate`, with a CPU
# fallback (`model.rs::select_device`). Switching device is a model swap (the model id gains
# `@metal`), so it forces a re-embed (ADR-0007). macOS-only: don't pass `--features metal` on
# Linux.
[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
tempfile = "3.27.0"
# The eval's search evidence probe (GH #201) reads `chunks_fts` directly. Dev-only, and
# feature-unified with b2-core's bundled build, so it adds nothing to the `b2` binary.
rusqlite = "0.40.1"
