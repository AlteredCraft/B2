[workspace]
resolver = "2"
members = [
    "crates/b2-core",
    "crates/b2-embed",
    "crates/b2-llm",
    "crates/b2-cli",
    "crates/b2-desktop",
]

# B2: local-first Markdown PKM with AI connection discovery. Design lives in docs/.

# Optimize dependencies even in dev builds, but keep our own `b2-*` crates at opt-level 0
# so rebuilds stay fast. Unoptimized candle (and its gemm backend) embeds ~13× slower, and
# a reindex cancel is only observed between embed batches (docs/index-engine.md), so a slow
# batch makes Cancel feel stuck. The `"*"` glob is needed to catch the matmul backend.
# Cost: a cold build compiles every dependency at opt-3.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.b2-core]
opt-level = 0
[profile.dev.package.b2-embed]
opt-level = 0
[profile.dev.package.b2-llm]
opt-level = 0
[profile.dev.package.b2-cli]
opt-level = 0
[profile.dev.package.b2-desktop]
opt-level = 0
